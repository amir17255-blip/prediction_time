<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برآوردگر هوشمند زمان تسک</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #2c3e50; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;}
        button { width: 100%; padding: 14px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:disabled { background-color: #95a5a6; }
        .result-box { display: none; margin-top: 25px; padding: 20px; border-radius: 10px; background-color: #e8f8f5; border: 1px solid #a3e4d7; }
        .metrics { display: flex; justify-content: space-between; text-align: center; margin-top: 15px; margin-bottom: 20px;}
        .metric { flex: 1; padding: 10px; }
        .metric span { display: block; font-size: 12px; color: #7f8c8d; margin-bottom: 5px; }
        .metric strong { font-size: 20px; color: #2c3e50; }
        .highlight { background: #d1f2eb; border-radius: 5px; padding: 5px; }
        #status { text-align: center; color: #3498db; font-size: 14px; margin-top: 10px; font-weight: bold; }
        .progress-container { background: #e0e0e0; border-radius: 10px; height: 12px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: #27ae60; transition: width 1s ease-in-out; }
        .assumptions { font-size: 12px; color: #7f8c8d; background: #f1f2f6; padding: 10px; border-radius: 6px; margin-top: 15px; border-right: 4px solid #3498db; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 برآوردگر هوشمند (وب)</h1>
    <div id="status">در حال بارگذاری تنظیمات...</div>
    
    <form id="predictionForm" style="display: none;">
        <div class="form-group"><label>ماژول:</label><select id="module"></select></div>
        <div class="form-group"><label>مجری:</label><select id="assignee"></select></div>
        <div class="form-group"><label>حجم کار:</label><select id="workload"></select></div>
        <div class="form-group"><label>نوع مسئله:</label><select id="task_type"></select></div>
        <div class="form-group"><label>اولویت:</label><select id="priority"></select></div>
        <div class="form-group"><label>برآورد اولیه شما (ساعت):</label><input type="number" id="estimated_h" value="8.0" step="0.5" required></div>
        <button type="submit" id="submitBtn">تحلیل و پیش‌بینی</button>
    </form>

    <div id="resultBox" class="result-box">
        <h3 style="text-align:center; margin-top:0;">🎯 گزارش تحلیلی تسک</h3>
        
        <div class="metrics">
            <div class="metric"><span>خوش‌بینانه (P10)</span><strong id="resP10">-</strong> ساعت</div>
            <div class="metric highlight"><span>واقع‌گرایانه (P50)</span><strong id="resP50">-</strong> ساعت</div>
            <div class="metric"><span>بدبینانه (P90)</span><strong id="resP90">-</strong> ساعت</div>
        </div>

        <label>احتمال اتمام کار در زمانِ برآورد شده شما (<span id="lblEst">0</span> ساعت):</label>
        <div class="progress-container">
            <div id="probBar" class="progress-bar" style="width: 0%;"></div>
        </div>
        <div style="text-align: left; font-size: 12px; font-weight: bold; color: #27ae60;" id="probText">0%</div>

        <div class="assumptions" id="assumptionsBox"></div>
    </div>
</div>

<script>
    let session;
    const form = document.getElementById('predictionForm');
    const status = document.getElementById('status');

    async function init() {
        try {
            status.innerText = "در حال دریافت options.json...";
            // پارامتر v برای دور زدن کش مرورگر
            const res = await fetch('options.json?v=' + new Date().getTime());
            if (!res.ok) throw new Error("فایل options.json در گیت‌هاب پیدا نشد.");
            
            const options = await res.json();
            
            // پیدا کردن کلیدهای درست (حتی اگر s نداشته باشند)
            const getList = (key) => {
                if (Array.isArray(options[key])) return options[key];
                if (Array.isArray(options[key + 's'])) return options[key + 's'];
                return ["نامشخص"]; 
            };

            const map = {
                'module': 'modules',
                'assignee': 'assignees',
                'workload': 'workloads',
                'task_type': 'task_types',
                'priority': 'priorities' // کلید درست برای اولویت
            };

            for (const [htmlId, jsonKey] of Object.entries(map)) {
                const select = document.getElementById(htmlId);
                select.innerHTML = '';
                const items = getList(jsonKey);
                items.forEach(item => select.add(new Option(item, item)));
            }

            status.innerText = "در حال بارگذاری مدل هوش مصنوعی (model.onnx)...";
            session = await ort.InferenceSession.create('model.onnx');
            
            status.style.display = 'none';
            form.style.display = 'block';
        } catch (e) {
            console.error(e);
            status.innerHTML = `<b style="color:red">خطا:</b><br>${e.message}`;
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        document.getElementById('submitBtn').innerText = 'در حال محاسبه...';
        document.getElementById('submitBtn').disabled = true;

        try {
            const inputData = {
                module: [document.getElementById('module').value],
                workload: [document.getElementById('workload').value],
                task_type: [document.getElementById('task_type').value],
                priority: [document.getElementById('priority').value],
                assignee: [document.getElementById('assignee').value],
                estimated_h: [parseFloat(document.getElementById('estimated_h').value)]
            };

            const feeds = {};
            for (const key in inputData) {
                if (key === 'estimated_h') {
                    feeds[key] = new ort.Tensor('float32', new Float32Array(inputData[key]), [1, 1]);
                } else {
                    feeds[key] = new ort.Tensor('string', inputData[key], [1, 1]);
                }
            }

            const results = await session.run(feeds);
            const outputData = Array.from(results[session.outputNames[0]].data);
            outputData.sort((a, b) => a - b);
            
            const p10 = outputData[Math.floor(outputData.length * 0.1)] || 0;
            const p50 = outputData[Math.floor(outputData.length * 0.5)] || 0;
            const p90 = outputData[Math.floor(outputData.length * 0.9)] || 0;
            const est_h = parseFloat(document.getElementById('estimated_h').value);

            // محاسبه احتمال مونت کارلو
            const onTimeCount = outputData.filter(val => val <= est_h).length;
            const probOnTime = ((onTimeCount / outputData.length) * 100).toFixed(1);

            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('resP10').innerText = Math.max(0, p10).toFixed(1);
            document.getElementById('resP50').innerText = Math.max(0, p50).toFixed(1);
            document.getElementById('resP90').innerText = Math.max(0, p90).toFixed(1);
            document.getElementById('lblEst').innerText = est_h;

            const probBar = document.getElementById('probBar');
            probBar.style.width = probOnTime + '%';
            document.getElementById('probText').innerText = probOnTime + '%';
            
            if(probOnTime < 50) probBar.style.background = '#e74c3c';
            else if(probOnTime < 80) probBar.style.background = '#f1c40f';
            else probBar.style.background = '#27ae60';

            let risk = "پایین";
            if (probOnTime < 30) risk = "بحرانی";
            else if (probOnTime < 60) risk = "بالا";
            else if (probOnTime < 80) risk = "متوسط";

            document.getElementById('assumptionsBox').innerHTML = `
                <strong>📌 تحلیل ریسک:</strong><br>
                سطح ریسک تاخیر: <b>${risk}</b><br>
                این تحلیل بر اساس رفتار تاریخی مدل در پیش‌بینی تسک‌های مشابه محاسبه شده است.
            `;

        } catch (error) {
            alert("خطا در پیش‌بینی: " + error.message);
            console.error(error);
        } finally {
            document.getElementById('submitBtn').innerText = 'تحلیل و پیش‌بینی';
            document.getElementById('submitBtn').disabled = false;
        }
    });

    init();
</script>
</body>
</html>
