<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برآوردگر وب (بدون سرور)</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #2c3e50; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 14px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:disabled { background-color: #95a5a6; }
        .result-box { display: none; margin-top: 25px; padding: 20px; border-radius: 10px; background-color: #e8f8f5; border: 1px solid #a3e4d7; }
        .metrics { display: flex; justify-content: space-between; text-align: center; margin-top: 15px; }
        .metric { flex: 1; padding: 10px; }
        .metric span { display: block; font-size: 12px; color: #7f8c8d; margin-bottom: 5px; }
        .metric strong { font-size: 20px; color: #2c3e50; }
        #status { text-align: center; color: #3498db; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 برآوردگر هوشمند (مبتنی بر مرورگر)</h1>
    <div id="status">در حال بارگذاری مدل...</div>
    
    <form id="predictionForm" style="display: none;">
        <div class="form-group"><label>ماژول:</label><select id="module"></select></div>
        <div class="form-group"><label>مجری:</label><select id="assignee"></select></div>
        <div class="form-group"><label>حجم کار:</label><select id="workload"></select></div>
        <div class="form-group"><label>نوع مسئله:</label><select id="task_type"></select></div>
        <div class="form-group"><label>اولویت:</label><select id="priority"></select></div>
        <div class="form-group"><label>برآورد اولیه شما (ساعت):</label><input type="number" id="estimated_h" value="8.0" step="0.5" required></div>
        <button type="submit" id="submitBtn">تحلیل و پیش‌بینی (بدون سرور)</button>
    </form>

    <div id="resultBox" class="result-box">
        <h3>🎯 نتیجه پیش‌بینی</h3>
        <div class="metrics">
            <div class="metric"><span>خوش‌بینانه</span><strong id="resP10">-</strong> ساعت</div>
            <div class="metric"><span>واقع‌گرایانه</span><strong id="resP50">-</strong> ساعت</div>
            <div class="metric"><span>بدبینانه</span><strong id="resP90">-</strong> ساعت</div>
        </div>
    </div>
</div>

<script>
    let session;
    const form = document.getElementById('predictionForm');
    const status = document.getElementById('status');

    // 1. بارگذاری مدل و گزینه‌ها
    async function init() {
        try {
            // خواندن لیست‌ها
            const res = await fetch('options.json');
            const options = await res.json();
            
            ['module', 'assignee', 'workload', 'task_type', 'priority'].forEach(field => {
                const select = document.getElementById(field);
                options[field + 's'].forEach(item => {
                    let option = new Option(item, item);
                    select.add(option);
                });
            });

            // بارگذاری مدل ONNX
            session = await ort.InferenceSession.create('model.onnx');
            
            status.style.display = 'none';
            form.style.display = 'block';
        } catch (e) {
            status.innerText = "خطا در بارگذاری مدل: " + e;
            status.style.color = "red";
        }
    }

    // 2. ارسال درخواست و پیش‌بینی در مرورگر
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        document.getElementById('submitBtn').innerText = 'در حال محاسبه...';

        try {
            const inputs = {
                module: [document.getElementById('module').value],
                workload: [document.getElementById('workload').value],
                task_type: [document.getElementById('task_type').value],
                priority: [document.getElementById('priority').value],
                assignee: [document.getElementById('assignee').value],
                estimated_h: [parseFloat(document.getElementById('estimated_h').value)]
            };

            // تبدیل ورودی‌ها به فرمت Tensor
            const feeds = {};
            for (const key in inputs) {
                if (key === 'estimated_h') {
                    feeds[key] = new ort.Tensor('float32', inputs[key], [1, 1]);
                } else {
                    feeds[key] = new ort.Tensor('string', inputs[key], [1, 1]);
                }
            }

            // اجرای مدل
            const results = await session.run(feeds);
            
            // Random Forest در ONNX خروجی‌های متغیر دارد. برای سادگی میانگین را می‌گیریم.
            const outputData = results[Object.keys(results)[0]].data;
            
            // محاسبه درصدها (تقریبی)
            outputData.sort((a, b) => a - b);
            const p10 = outputData[Math.floor(outputData.length * 0.1)];
            const p50 = outputData[Math.floor(outputData.length * 0.5)];
            const p90 = outputData[Math.floor(outputData.length * 0.9)];

            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('resP10').innerText = Math.max(0, p10).toFixed(1);
            document.getElementById('resP50').innerText = Math.max(0, p50).toFixed(1);
            document.getElementById('resP90').innerText = Math.max(0, p90).toFixed(1);

        } catch (error) {
            alert("خطا در پیش‌بینی: " + error.message);
        }
        document.getElementById('submitBtn').innerText = 'تحلیل و پیش‌بینی (بدون سرور)';
    });

    init();
</script>
</body>
</html>
